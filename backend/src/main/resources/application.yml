spring:
  application.name: streamflix-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamflix}
    username: ${DB_USERNAME:streamflix}
    password: ${DB_PASSWORD:streamflix}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server.port: ${PORT:8080}
app:
  jwt:
    # Replace this in deployed environments with a random secret of at least 32 characters.
    secret: ${JWT_SECRET:streamflix-local-development-secret-change-me-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  media:
    root: ${MEDIA_ROOT:./media}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
