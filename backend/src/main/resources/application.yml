spring:
  application.name: streamflix-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamflix}
    username: ${DB_USERNAME:streamflix}
    password: ${DB_PASSWORD:streamflix}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server.port: ${PORT:8080}
server.forward-headers-strategy: framework
server.tomcat.max-swallow-size: 100MB
spring.servlet.multipart.max-file-size: ${MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size: ${MAX_REQUEST_SIZE:2GB}
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: never
logging:
  level:
    com.streamflix: INFO
app:
  jwt:
    # Replace this in deployed environments with a random secret of at least 32 characters.
    secret: ${JWT_SECRET:streamflix-local-development-secret-change-me-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  media:
    root: ${MEDIA_ROOT:./media}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  admin:
    email: ${ADMIN_EMAIL:}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:4200}
